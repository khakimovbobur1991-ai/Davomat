*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
body{background:#f1f5f9;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;color:#1e293b;font-size:14px;}
button{font-family:inherit;cursor:pointer;border:none;transition:all .15s;}
input,select{font-family:inherit;}
.topbar{background:#fff;border-bottom:1px solid #e2e8f0;padding:0 12px;display:flex;align-items:center;justify-content:space-between;height:52px;position:sticky;top:0;z-index:100;box-shadow:0 1px 6px rgba(0,0,0,.06);gap:8px;}
.logo{display:flex;align-items:center;gap:8px;flex-shrink:0;}
.logo-icon{width:28px;height:28px;border-radius:7px;background:linear-gradient(135deg,#0ea5e9,#6366f1);display:flex;align-items:center;justify-content:center;font-size:14px;}
.logo-text{font-weight:700;font-size:14px;color:#0f172a;white-space:nowrap;}
.nav{display:flex;gap:4px;overflow-x:auto;padding:4px 0;}
.nav::-webkit-scrollbar{display:none;}
.nav-btn{padding:6px 10px;border-radius:8px;font-weight:600;font-size:12px;white-space:nowrap;border:none;}
.nav-btn.active{background:#0ea5e9;color:#fff;}
.nav-btn:not(.active){background:#f1f5f9;color:#64748b;}
.wrap{max-width:820px;margin:0 auto;padding:14px 12px 40px;}
.card{background:#fff;border-radius:14px;border:1px solid #e2e8f0;padding:14px 16px;margin-bottom:12px;}
.step-lbl{font-size:10px;font-weight:700;color:#94a3b8;letter-spacing:1.5px;margin-bottom:8px;text-transform:uppercase;}
.row{display:flex;gap:8px;flex-wrap:wrap;}
.shift-btn{flex:1;padding:12px 4px;border-radius:10px;font-weight:700;font-size:14px;text-align:center;border:none;}
.dept-btn{flex:1 1 70px;padding:9px 4px;border-radius:10px;font-weight:700;font-size:13px;text-align:center;border:none;}
.stats{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:12px;}
.stat{border-radius:11px;padding:9px 6px;text-align:center;flex:1;min-width:72px;}
.stat-v{font-size:18px;font-weight:700;}
.stat-l{font-size:9px;font-weight:600;opacity:.8;margin-top:1px;}
.emp{border-radius:10px;margin-bottom:6px;overflow:hidden;border:1.5px solid #e2e8f0;background:#f8fafc;}
.emp.absent{border-color:#fca5a5;background:#fff5f5;}
.emp-row{display:flex;align-items:center;gap:10px;padding:11px 12px;cursor:pointer;}
.chk{width:24px;height:24px;border-radius:6px;border:2px solid #cbd5e1;background:transparent;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:13px;color:#fff;}
.chk.on{background:#ef4444;border-color:#ef4444;}
.tabel{font-size:11px;color:#94a3b8;width:52px;flex-shrink:0;font-variant-numeric:tabular-nums;}
.emp-name{flex:1;font-size:14px;font-weight:500;color:#334155;}
.emp-name.absent{color:#dc2626;font-weight:600;}
.emp-detail{padding:0 12px 11px 46px;display:flex;flex-direction:column;gap:6px;}
select.reason{width:100%;padding:8px 10px;border-radius:8px;border:1.5px solid #fca5a5;font-size:13px;background:#fff;color:#374151;outline:none;}
.late-row{display:flex;align-items:center;gap:8px;}
.late-lbl{font-size:12px;color:#f59e0b;font-weight:600;white-space:nowrap;}
input.late{flex:1;padding:6px 10px;border-radius:8px;border:1.5px solid #fde68a;font-size:13px;background:#fffbeb;color:#92400e;outline:none;font-weight:600;}
.save-btn{width:100%;padding:14px;border-radius:12px;border:none;color:#fff;font-weight:700;font-size:16px;cursor:pointer;box-shadow:0 4px 16px rgba(14,165,233,.2);}
.vak-row{display:flex;align-items:center;gap:12px;}
.vak-btn{width:40px;height:40px;border-radius:9px;border:1.5px solid #e2e8f0;background:#f8fafc;font-size:22px;font-weight:700;color:#64748b;display:flex;align-items:center;justify-content:center;}
input.vak{width:72px;padding:8px;border-radius:10px;border:1.5px solid #e2e8f0;font-size:20px;font-weight:700;text-align:center;color:#0f172a;background:#f8fafc;outline:none;}
/* Chart */
.chart-bar-wrap{display:flex;flex-direction:column;gap:10px;}
.bar-row{display:flex;align-items:center;gap:8px;}
.bar-lbl{width:70px;font-weight:700;font-size:13px;flex-shrink:0;}
.bar-track{flex:1;background:#f1f5f9;border-radius:8px;height:18px;overflow:hidden;position:relative;}
.bar-fill{height:100%;border-radius:8px;transition:width .5s;}
.bar-pct{width:44px;text-align:right;font-weight:700;font-size:13px;flex-shrink:0;}
.bar-cnt{font-size:11px;color:#94a3b8;flex-shrink:0;width:60px;}
/* History */
.hist-card{background:#fff;border-radius:13px;border:1px solid #e2e8f0;padding:13px 15px;margin-bottom:10px;}
.badge{padding:2px 9px;border-radius:20px;font-size:11px;font-weight:700;}
.abs-row{display:flex;font-size:12px;margin-bottom:4px;gap:6px;flex-wrap:wrap;}
.note-box{background:#fef3c7;border-radius:11px;border:1px solid #fde68a;padding:11px 15px;font-size:12px;color:#92400e;}
@media(max-width:400px){.stat-v{font-size:15px;}.stat-l{font-size:8px;}}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#0f172a;color:#fff;padding:12px 22px;border-radius:12px;font-weight:700;font-size:14px;z-index:9999;box-shadow:0 4px 20px rgba(0,0,0,.18);transition:opacity .3s;white-space:nowrap;}
</style>

const LS_KEY="davomat_records_v2";

function saveToLS(recs){try{localStorage.setItem(LS_KEY,JSON.stringify(recs));}catch(e){}}
function loadFromLS(){try{const d=localStorage.getItem(LS_KEY);return d?JSON.parse(d):{}}catch(e){return{};}}

// Google Sheets ga saqlash (GET orqali - CORS muammosi yoq)
async function saveToSheet(record) {
  try {
    const url = SHEET_URL + "?data=" + encodeURIComponent(JSON.stringify(record));
    const res = await fetch(url);
    const json = await res.json();
    if(json.ok) { console.log("Sheet saqlandi"); }
    else { console.log("Sheet xatosi:", json.error); showToast("Sheets xatosi: " + json.error); }
  } catch(e) {
    console.log("Sheet saqlash xatosi:", e);
    showToast("Sheets ulanmadi, local saqlandi");
  }
}

// Google Sheets dan o'qish
async function loadFromSheet() {
  try {
    const res = await fetch(SHEET_URL + "?action=getAll&t=" + Date.now());
    if(!res.ok) throw new Error("HTTP " + res.status);
    const json = await res.json();
    if(json.ok && json.data && Array.isArray(json.data)) {
      let count = 0;
      json.data.forEach(rec => {
        if(rec && rec.date && rec.dept && rec.shift) {
          const key = rec.date + "__" + (rec.shiftTime||"kunduzgi") + "__" + rec.dept + "__" + rec.shift;
          // Faqat yangroq ma'lumotni saqlash
          if(!S.records[key] || rec.date >= (S.records[key].date||"")) {
            S.records[key] = rec;
            count++;
          }
        }
      });
      saveToLS(S.records);
      // Sync vaqtini yangilash
      const now = new Date();
      const t = now.getHours().toString().padStart(2,"0")+":"+now.getMinutes().toString().padStart(2,"0")+":"+now.getSeconds().toString().padStart(2,"0");
      S._lastSync = t;
      const el = document.getElementById("syncInfo");
      if(el) el.textContent = "🕐 " + t + " da yangilandi · " + Object.keys(S.records).length + " yozuv";
      console.log("Sheets dan yuklandi:", count, "ta yozuv");
    }
  } catch(e) {
    console.log("Sheet o'qish xatosi:", e);
  }
}

// Admin uchun avtomatik yangilash (har 30 soniyada)
let _pollInterval = null;
function startAdminPolling() {
  stopAdminPolling();
  _pollInterval = setInterval(async () => {
    if(S.user && S.user.isAdmin) {
      await loadFromSheet();
      render();
    }
  }, 30000);
}
function stopAdminPolling() {
  if(_pollInterval) { clearInterval(_pollInterval); _pollInterval = null; }
}

const S={
  view:"form",
  user:null, // logged in user
  loginInput:"",
  parolInput:"",
  loginErr:"",
  date:(()=>{const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");})(),
  shiftTime:"kunduzgi",
  shift:"A",
  dept:"ub",
  absentMap:{},
  vakant:0,
  lateHours:{},
  records:loadFromLS(),
  saved:false,
};

function disp(s){if(!s)return"";const[y,m,d]=s.split("-");return d+"."+m+"."+y;}
function getKey(){return S.date+"__"+S.shiftTime+"__"+S.dept+"__"+S.shift;}
function getDept(){return DEPTS.find(d=>d.id===S.dept);}
function getEmps(){const d=getDept();return d&&d.emps[S.shift]?d.emps[S.shift]:[];}
function getSlots(){return SLOTS[S.dept]||getEmps().length;}
function getAbsCnt(){return Object.keys(S.absentMap).length;}
function getPresCnt(){return getEmps().length-getAbsCnt();}
function getPct(){const e=getEmps().length;return e>0?((getPresCnt()/e)*100).toFixed(1):"0.0";}
function getAbsRate(){const s=getSlots();return s>0?((getAbsCnt()/s)*100).toFixed(1):"0.0";}

function showToast(msg,dur=2500){
  const t=document.getElementById("toast");
  if(!t)return;
  t.textContent=msg;t.style.opacity="1";
  clearTimeout(t._to);
  t._to=setTimeout(()=>{t.style.opacity="0";},dur);
}

function loadRecord(k){
  const r=S.records[k];
  S.absentMap=r?JSON.parse(JSON.stringify(r.absentMap)):{};
  S.vakant=r?(r.vakant||0):0;
  S.lateHours=r?JSON.parse(JSON.stringify(r.lateHours||{})):{};
}

function render(){
  if(!S.user){renderLogin();return;}
  if(S.user.isAdmin){renderAdminNav();renderAdmin();return;}
  renderNav();
  renderApp();
}

function renderAdmin(){
  const app=document.getElementById("app");
  if(S.view==="admin_detail"){app.innerHTML=renderAdminDetail();return;}
  if(S.view==="admin_chart"){app.innerHTML=renderAdminChart();return;}

  // Barcha yozuvlarni to'plash
  const recs=Object.values(S.records);

  // Bo'limlar bo'yicha jamlanma (eng oxirgi yozuv)
  const deptSummary=DEPTS.map(dep=>{
    const dr=recs.filter(r=>r.dept===dep.id);
    if(!dr.length)return{name:dep.name,total:0,present:0,absent:0,pct:"—",absRate:"—",vakant:0,slots:SLOTS[dep.id]||0};
    // Har bir shift uchun oxirgi yozuv
    const byShift={};
    dr.forEach(r=>{
      const k=r.shift;
      if(!byShift[k]||r.date>byShift[k].date)byShift[k]=r;
    });
    const latest=Object.values(byShift);
    const total=latest.reduce((s,r)=>s+r.total,0);
    const present=latest.reduce((s,r)=>s+r.present,0);
    const absent=latest.reduce((s,r)=>s+r.absentCount,0);
    const slots=SLOTS[dep.id]||0;
    const pct=total>0?((present/total)*100).toFixed(1):"—";
    const absRate=slots>0?((absent/slots)*100).toFixed(1):"—";
    const vakant=latest.reduce((s,r)=>s+(r.vakant||0),0);
    return{name:dep.name,total,present,absent,pct,absRate,vakant,slots};
  });

  const grandTotal=deptSummary.reduce((s,d)=>s+d.total,0);
  const grandPresent=deptSummary.reduce((s,d)=>s+d.present,0);
  const grandAbsent=deptSummary.reduce((s,d)=>s+d.absent,0);
  const grandSlots=deptSummary.reduce((s,d)=>s+d.slots,0);
  const grandPct=grandTotal>0?((grandPresent/grandTotal)*100).toFixed(1):"0.0";
  const grandAbs=grandSlots>0?((grandAbsent/grandSlots)*100).toFixed(1):"0.0";
  const grandVakant=deptSummary.reduce((s,d)=>s+d.vakant,0);

  // Sabab bo'yicha tahlil
  const reasonCount={};
  recs.forEach(r=>(r.absentList||[]).forEach(a=>{
    reasonCount[a.reason]=(reasonCount[a.reason]||0)+1;
  }));
  const reasonRows=Object.entries(reasonCount).sort((a,b)=>b[1]-a[1]).map(([v,cnt])=>{
    const ro=REASONS.find(r=>r.v===v);
    return`<div style="display:flex;justify-content:space-between;align-items:center;padding:7px 0;border-bottom:1px solid #f1f5f9">
      <span style="color:${ro?ro.c:"#94a3b8"};font-weight:600;font-size:13px">${ro?ro.l:v}</span>
      <span style="font-weight:700;font-size:14px;color:#0f172a">${cnt} marta</span>
    </div>`;
  }).join("")||`<div style="color:#94a3b8;text-align:center;padding:16px">Ma'lumot yo'q</div>`;

  const deptCards=deptSummary.map(d=>{
    const pctNum=parseFloat(d.pct)||0;
    const fc=pctNum>=90?"#16a34a":pctNum>=70?"#ca8a04":"#dc2626";
    const absNum=parseFloat(d.absRate)||0;
    const ac=absNum<=5?"#16a34a":absNum<=10?"#b45309":"#dc2626";
    return`<div style="background:#fff;border-radius:13px;border:1px solid #e2e8f0;padding:14px 16px;margin-bottom:10px">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px">
        <span style="font-weight:700;font-size:16px">${d.name}</span>
        <span style="font-size:12px;color:#64748b">${d.slots} ish o'rin</span>
      </div>
      <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px">
        <div class="stat" style="background:#dcfce7"><div class="stat-v" style="color:#22c55e">${d.present}</div><div class="stat-l" style="color:#22c55e">Keldi</div></div>
        <div class="stat" style="background:#fee2e2"><div class="stat-v" style="color:#ef4444">${d.absent}</div><div class="stat-l" style="color:#ef4444">Kelmadi</div></div>
        <div class="stat" style="background:#eef2ff"><div class="stat-v" style="color:${fc}">${d.pct}%</div><div class="stat-l" style="color:#6366f1">Davomat</div></div>
        <div class="stat" style="background:#fef3c7"><div class="stat-v" style="color:${ac}">${d.absRate}%</div><div class="stat-l" style="color:#f59e0b">Absenteeism</div></div>
        ${d.vakant>0?`<div class="stat" style="background:#fef9c3"><div class="stat-v" style="color:#b45309">${d.vakant}</div><div class="stat-l" style="color:#b45309">Vakant</div></div>`:""}
      </div>
      <div style="background:#f1f5f9;border-radius:6px;height:8px;overflow:hidden">
        <div style="height:100%;border-radius:6px;width:${Math.min(pctNum,100)}%;background:${pctNum>=90?"#22c55e":pctNum>=70?"#f59e0b":"#ef4444"}"></div>
      </div>
    </div>`;
  }).join("");

  app.innerHTML=`
    <div style="font-weight:700;font-size:18px;color:#0f172a;margin-bottom:4px">Admin Panel</div>
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;flex-wrap:wrap;gap:8px">

        <button onclick="exportCSV()" style="padding:7px 14px;border-radius:8px;background:#dcfce7;color:#16a34a;font-size:12px;font-weight:700;border:none;cursor:pointer">📥 CSV</button>
      </div>
    </div>

    <!-- Umumiy kartochkalar -->
    <div class="stats" style="margin-bottom:14px">
      <div class="stat" style="background:#e0f2fe"><div class="stat-v" style="color:#0ea5e9">${grandTotal}</div><div class="stat-l" style="color:#0ea5e9">Jami ro'yxat</div></div>
      <div class="stat" style="background:#dcfce7"><div class="stat-v" style="color:#22c55e">${grandPresent}</div><div class="stat-l" style="color:#22c55e">Keldi</div></div>
      <div class="stat" style="background:#fee2e2"><div class="stat-v" style="color:#ef4444">${grandAbsent}</div><div class="stat-l" style="color:#ef4444">Kelmadi</div></div>
      <div class="stat" style="background:#eef2ff"><div class="stat-v" style="color:#6366f1">${grandPct}%</div><div class="stat-l" style="color:#6366f1">Davomat</div></div>
      <div class="stat" style="background:#fef3c7"><div class="stat-v" style="color:#f59e0b">${grandAbs}%</div><div class="stat-l" style="color:#f59e0b">Absenteeism</div></div>
      <div class="stat" style="background:#fef9c3"><div class="stat-v" style="color:#b45309">${grandVakant}</div><div class="stat-l" style="color:#b45309">Vakant</div></div>
    </div>

    <!-- Bo'limlar -->
    <div style="font-weight:700;font-size:15px;color:#0f172a;margin-bottom:10px">Bo'limlar bo'yicha</div>
    ${deptCards}

    <!-- Sabab tahlili -->
    <div class="card">
      <div style="font-weight:700;font-size:15px;color:#0f172a;margin-bottom:12px">Kelmaslik sabablari tahlili</div>
      ${reasonRows}
    </div>`;

      <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap">
        <div>
          <div style="font-size:11px;color:#64748b;font-weight:600;letter-spacing:1px">BO'LIM · SMENA</div>
          <div style="font-weight:700;font-size:18px;color:#0f172a">${deptName} — ${u.shift} smena</div>
        </div>
        <div style="margin-left:auto;text-align:right">
          <div style="font-size:11px;color:#64748b;font-weight:600;letter-spacing:1px">FOYDALANUVCHI</div>
          <div style="font-weight:700;font-size:15px;color:#6366f1">${u.login}</div>
        </div>
      </div>
    </div>
    <div class="card">
      <div class="step-lbl">1 · Sana tanlang</div>
      <input type="date" value="${S.date}" onchange="chgDate(this.value)"
        style="width:100%;padding:10px 14px;border-radius:10px;border:1.5px solid #e2e8f0;font-size:16px;color:#0f172a;font-weight:600;background:#f8fafc;outline:none"/>
      ${S.records[S.date+"__"+S.shiftTime+"__"+u.dept+"__"+u.shift]?'<div style="margin-top:8px;font-size:12px;color:#0ea5e9;font-weight:600">✓ Bu kun uchun ma\'lumot mavjud — tahrirlash mumkin</div>':""}
    </div>
    <div class="card">
      <div class="step-lbl">2 · Smena vaqti</div>
      <div class="row">
        <button class="shift-btn" onclick="chgShiftTime('kunduzgi')"
          style="background:${S.shiftTime==="kunduzgi"?"#fef3c7":"#f8fafc"};color:${S.shiftTime==="kunduzgi"?"#b45309":"#64748b"};box-shadow:${S.shiftTime==="kunduzgi"?"0 0 0 2px #f59e0b":"0 0 0 1.5px #e2e8f0"}">
          ☀️ Kunduzgi
        </button>
        <button class="shift-btn" onclick="chgShiftTime('tungi')"
          style="background:${S.shiftTime==="tungi"?"#eef2ff":"#f8fafc"};color:${S.shiftTime==="tungi"?"#4f46e5":"#64748b"};box-shadow:${S.shiftTime==="tungi"?"0 0 0 2px #6366f1":"0 0 0 1.5px #e2e8f0"}">
          🌙 Tungi
        </button>
      </div>
    </div>
    <div class="card">
      <div class="step-lbl">Bo'sh ish o'rinlari (Vakant)</div>
      <div class="vak-row">
        <button class="vak-btn" onclick="chgVakant(-1)">−</button>
        <input class="vak" type="number" min="0" value="${S.vakant}" onchange="setVakant(this.value)"/>
        <button class="vak-btn" onclick="chgVakant(1)">+</button>
        <span style="font-size:13px;color:#94a3b8">ta bo'sh o'rin</span>
      </div>
    </div>
    <div class="stats">${stats}</div>
    <div class="card">
      <div class="step-lbl">3 · Kelmagan xodimlarni belgilang</div>
      ${empList}
    </div>
    <button class="save-btn" onclick="doSave()" style="${saveStyle}">
      ${S.saved?"✓ Muvaffaqiyatli saqlandi!":"💾 Saqlash"}
    </button>`;
}

// ===================== CHART =====================
function renderChart(){
  const rows=DEPTS.map(dep=>{
    const dr=Object.values(S.records).filter(r=>r.dept===dep.id);
    let keldi,kelmadi,foiz;
    if(!dr.length){
      const t=Object.values(dep.emps).flat().length;
      keldi=t;kelmadi=0;foiz=100;
    } else {
      const lt=dr.sort((a,b)=>b.date.localeCompare(a.date))[0];
      keldi=lt.present;kelmadi=lt.absentCount;foiz=parseFloat(lt.percent);
    }
    const maxVal=Object.values(dep.emps).flat().length||1;
    const keldiW=Math.round((keldi/maxVal)*100);
    const kelmW=Math.round((kelmadi/maxVal)*100);
    const fc=foiz>=90?"#22c55e":foiz>=70?"#f59e0b":"#ef4444";
    return`<div style="background:#fff;border-radius:13px;border:1px solid #e2e8f0;padding:13px 15px;margin-bottom:10px">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px">
        <span style="font-weight:700;font-size:15px">${dep.name}</span>
        <span style="font-weight:700;font-size:14px;color:${fc}">${foiz}%</span>
      </div>
      <div style="display:flex;align-items:center;gap:8px;margin-bottom:6px">
        <span style="width:60px;font-size:12px;color:#64748b">Keldi</span>
        <div style="flex:1;background:#f1f5f9;border-radius:6px;height:14px;overflow:hidden">
          <div style="height:100%;border-radius:6px;width:${keldiW}%;background:#22c55e"></div>
        </div>
        <span style="width:28px;text-align:right;font-weight:700;color:#22c55e;font-size:13px">${keldi}</span>
      </div>
      <div style="display:flex;align-items:center;gap:8px">
        <span style="width:60px;font-size:12px;color:#64748b">Kelmadi</span>
        <div style="flex:1;background:#f1f5f9;border-radius:6px;height:14px;overflow:hidden">
          <div style="height:100%;border-radius:6px;width:${kelmW}%;background:#ef4444"></div>
        </div>
        <span style="width:28px;text-align:right;font-weight:700;color:#ef4444;font-size:13px">${kelmadi}</span>
      </div>
    </div>`;
  }).join("");
  return`<div style="font-weight:700;font-size:18px;color:#0f172a;margin-bottom:14px">Bo'limlar bo'yicha davomat</div>${rows}`;
}

// ===================== ABSENTEEISM =====================
function renderAbsenteeism(){
  const data=DEPTS.map(dep=>{
    const dr=Object.values(S.records).filter(r=>r.dept===dep.id);
    const sl=SLOTS[dep.id]||0;
    if(!dr.length)return{name:dep.name,slots:sl,abs:0,absences:0};
    const lt=dr.sort((a,b)=>b.date.localeCompare(a.date))[0];
    return{name:dep.name,slots:sl,abs:parseFloat(lt.absenteeismRate||0),absences:lt.absentCount||0};
  });

  const bars=data.map(d=>{
    const fc=d.abs<=5?"#16a34a":d.abs<=10?"#b45309":"#dc2626";
    const bg=d.abs<=5?"#22c55e":d.abs<=10?"#f59e0b":"#ef4444";
    return`<div style="margin-bottom:14px">
      <div style="display:flex;justify-content:space-between;margin-bottom:5px">
        <span style="font-weight:700;font-size:14px">${d.name}</span>
        <span style="font-size:12px;color:#64748b">${d.slots} o'rin · <span style="color:#ef4444;font-weight:600">${d.absences} kelmadi</span></span>
      </div>
      <div style="display:flex;align-items:center;gap:10px">
        <div style="flex:1;background:#f1f5f9;border-radius:8px;height:14px;overflow:hidden">
          <div style="height:100%;border-radius:8px;width:${Math.min(d.abs,100)}%;background:${bg}"></div>
        </div>
        <span style="width:44px;text-align:right;font-weight:700;font-size:14px;color:${fc}">${d.abs}%</span>
      </div>
    </div>`;
  }).join("");

  const ts=data.reduce((s,d)=>s+d.slots,0);
  const ta=data.reduce((s,d)=>s+d.absences,0);
  const av=ts>0?((ta/ts)*100).toFixed(1):"0.0";

  return`
    <div style="font-weight:700;font-size:18px;color:#0f172a;margin-bottom:14px">Absenteeism Ko'rsatkichlari</div>
    <div class="card">
      <div style="font-size:12px;color:#64748b;margin-bottom:14px">Absenteeism = (Kelmagan xodimlar / Jami ish o'rinlari) × 100%</div>
      ${bars}
    </div>
    <div class="card">
      <div style="font-size:12px;font-weight:600;color:#64748b;margin-bottom:10px">Umumiy ko'rsatkich</div>
      <div class="stats">
        <div class="stat" style="background:#f1f5f9"><div class="stat-v" style="color:#64748b">${ts}</div><div class="stat-l" style="color:#64748b">Jami o'rinlar</div></div>
        <div class="stat" style="background:#fee2e2"><div class="stat-v" style="color:#ef4444">${ta}</div><div class="stat-l" style="color:#ef4444">Jami kelmadi</div></div>
        <div class="stat" style="background:#fef3c7"><div class="stat-v" style="color:#f59e0b">${av}%</div><div class="stat-l" style="color:#f59e0b">Umumiy absenteeism</div></div>
      </div>
    </div>
    <div class="note-box">🟢 0–5% — Yaxshi &nbsp; 🟡 5–10% — O'rtacha &nbsp; 🔴 10%+ — Yuqori</div>`;
}

// ===================== HISTORY =====================
function renderHistory(){
  const recs=Object.values(S.records).sort((a,b)=>b.date.localeCompare(a.date));
  if(!recs.length)return`
    <div style="font-weight:700;font-size:18px;color:#0f172a;margin-bottom:14px">Saqlangan yozuvlar</div>
    <div class="card" style="text-align:center;color:#94a3b8;padding:40px">Hali hech qanday ma'lumot kiritilmagan</div>`;

  const cards=recs.map(rec=>{
    const dep=DEPTS.find(d=>d.id===rec.dept);
    const pct=parseFloat(rec.percent);
    const pc=pct>=90?"#16a34a":pct>=70?"#ca8a04":"#dc2626";
    const pbg=pct>=90?"#dcfce7":pct>=70?"#fef9c3":"#fee2e2";
    const sc=rec.shift==="A"?"#16a34a":rec.shift==="B"?"#1d4ed8":"#b45309";
    const sbg=rec.shift==="A"?"#dcfce7":rec.shift==="B"?"#dbeafe":"#fef3c7";
    const stc=rec.shiftTime==="tungi"?"#4f46e5":"#b45309";
    const stbg=rec.shiftTime==="tungi"?"#eef2ff":"#fef3c7";
    const absList=(rec.absentList||[]).map(a=>{
      const ro=REASONS.find(r=>r.v===a.reason);
      const late=a.reason==="VAQT"&&a.lateHour?`<span style="color:#f59e0b;font-weight:700">⏱ ${a.lateHour} soat</span>`:"";
      return`<div class="abs-row">
        <span style="color:#64748b;font-variant-numeric:tabular-nums;width:52px;flex-shrink:0">${a.tabel}</span>
        <span style="color:#334155;flex:1;min-width:90px">${a.name}</span>
        <span style="color:${ro?ro.c:"#94a3b8"};font-weight:600;flex-shrink:0">${ro?ro.l:""}</span>
        ${late}
      </div>`;
    }).join("");

    return`<div class="hist-card">
      <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:8px;gap:6px;flex-wrap:wrap">
        <div style="display:flex;gap:6px;align-items:center;flex-wrap:wrap">
          <span style="font-weight:700;font-size:15px">${dep?dep.name:rec.dept}</span>
          <span class="badge" style="background:${stbg};color:${stc}">${rec.shiftTime==="tungi"?"🌙 Tungi":"☀️ Kunduzgi"}</span>
          <span class="badge" style="background:${sbg};color:${sc}">${rec.shift} smena</span>
          <span style="font-size:12px;color:#94a3b8">${disp(rec.date)}</span>
        </div>
        <span class="badge" style="background:${pbg};color:${pc}">${rec.percent}%</span>
      </div>
      <div style="display:flex;gap:12px;flex-wrap:wrap;margin-bottom:${absList?"10px":"0"}">
        <span style="font-size:13px;color:#22c55e;font-weight:600">✓ Keldi: ${rec.present}/${rec.total}</span>
        <span style="font-size:13px;color:#ef4444;font-weight:600">✗ Kelmadi: ${rec.absentCount}</span>
        ${rec.vakant>0?`<span style="font-size:13px;color:#f59e0b;font-weight:600">🪑 Vakant: ${rec.vakant}</span>`:""}
      </div>
      ${absList?`<div style="border-top:1px solid #f1f5f9;padding-top:8px">${absList}</div>`:""}
    </div>`;
  }).join("");

  return`<div style="font-weight:700;font-size:18px;color:#0f172a;margin-bottom:14px">Saqlangan yozuvlar</div>${cards}`;
}

function doLogin(){
  const u=USERS.find(x=>x.login===S.loginInput.trim()&&x.parol===S.parolInput.trim());
  if(!u){S.loginErr="Login yoki parol noto'g'ri!";render();return;}
  S.user=u;
  if(!u.isAdmin){
    S.dept=u.dept;S.shift=u.shift;
    S.absentMap={};S.vakant=0;S.lateHours={};S.saved=false;
    loadRecord(S.date+"__"+S.shiftTime+"__"+u.dept+"__"+u.shift);
    S.view="form";
    stopAdminPolling();
    render();
  } else {
    S.view="admin";
    render();
    showToast("⏳ Ma'lumotlar yuklanmoqda...", 2000);
    loadFromSheet().then(()=>{render();showToast("✅ Ma'lumotlar yuklandi!");});
    startAdminPolling();
  }
}
function adminRefresh(){
  showToast("⏳ Yangilanmoqda...", 1500);
  loadFromSheet().then(()=>{render();showToast("✅ Yangilandi! " + Object.keys(S.records).length + " ta yozuv");});
}
function doLogout(){
  stopAdminPolling();
  S.user=null;S.loginInput="";S.parolInput="";S.loginErr="";
  S.absentMap={};S.vakant=0;S.lateHours={};S.saved=false;
  render();
}
function chgDate(v){S.date=v;loadRecord(S.date+"__"+S.shiftTime+"__"+S.user.dept+"__"+S.user.shift);S.saved=false;render();}
function chgShiftTime(v){S.shiftTime=v;loadRecord(S.date+"__"+v+"__"+S.user.dept+"__"+S.user.shift);S.saved=false;render();}
function toggleAbs(t){
  if(S.absentMap[t])delete S.absentMap[t];
  else S.absentMap[t]="BS";
  S.saved=false;render();
}
function setReason(t,r){
  S.absentMap[t]=r;
  if(r!=="VAQT")delete S.lateHours[t];
  S.saved=false;render();
}
function setLH(t,v){S.lateHours[t]=v;S.saved=false;}
function chgVakant(d){S.vakant=Math.max(0,S.vakant+d);S.saved=false;render();}
function setVakant(v){S.vakant=Math.max(0,parseInt(v)||0);S.saved=false;}
function doSave(){
  const u=S.user;
  const dept=DEPTS.find(d=>d.id===u.dept);
  const emps=dept&&dept.emps[u.shift]?dept.emps[u.shift]:[];
  const slots=SLOTS[u.dept]||emps.length;
  const absCnt=Object.keys(S.absentMap).length;
  const presCnt=emps.length-absCnt;
  const pct=emps.length>0?((presCnt/emps.length)*100).toFixed(1):"0.0";
  const absRate=slots>0?((absCnt/slots)*100).toFixed(1):"0.0";
  const al=Object.entries(S.absentMap).map(([t,r])=>{
    const e=emps.find(x=>x.t===t);
    return{tabel:t,name:e?e.n:"",reason:r,lateHour:S.lateHours[t]||""};
  });
  const key=S.date+"__"+S.shiftTime+"__"+u.dept+"__"+u.shift;
  S.records[key]={
    date:S.date,shiftTime:S.shiftTime,dept:u.dept,shift:u.shift,
    total:emps.length,totalSlots:slots,present:presCnt,
    absentCount:absCnt,percent:pct,absenteeismRate:absRate,
    absentMap:JSON.parse(JSON.stringify(S.absentMap)),
    absentList:al,vakant:S.vakant,
    lateHours:JSON.parse(JSON.stringify(S.lateHours))
  };
  S.saved=true;render();
  saveToSheet(S.records[key]);
  saveToLS(S.records);
  showToast("✅ Muvaffaqiyatli saqlandi!");
  setTimeout(()=>{S.saved=false;render();},2500);
}

// ===================== CSV EXPORT =====================
function exportCSV(){
  const recs=Object.values(S.records).sort((a,b)=>b.date.localeCompare(a.date));
  if(!recs.length){showToast("❌ Ma'lumot yo'q");return;}
  const header="Sana,Bo'lim,Smena,Smena vaqti,Jami,Keldi,Kelmadi,Davomat%,Absenteeism%,Vakant,Kelmagan xodimlar\n";
  const rows=recs.map(r=>{
    const al=(r.absentList||[]).map(a=>`${a.tabel}:${a.name}(${a.reason})`).join("; ");
    return`${disp(r.date)},${r.dept},${r.shift},${r.shiftTime},${r.total},${r.present},${r.absentCount},${r.percent},${r.absenteeismRate},${r.vakant||0},"${al}"`;
  }).join("\n");
  const blob=new Blob(["\uFEFF"+header+rows],{type:"text/csv;charset=utf-8;"});
  const url=URL.createObjectURL(blob);
  const a=document.createElement("a");
  a.href=url;a.download="davomat_"+new Date().toISOString().slice(0,10)+".csv";
  a.click();URL.revokeObjectURL(url);
  showToast("📥 CSV yuklab olindi!");
}

// ===================== INIT =====================
render();
</script>
</body>
</html>
